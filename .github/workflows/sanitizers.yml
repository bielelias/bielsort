name: Native sanitizers

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sanitizers.yml"
      - "pyproject.toml"
      - "setup.py"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/sanitizers.yml"
      - "pyproject.toml"
      - "setup.py"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build sanitized wheel
        env:
          BIELSORT_SANITIZE: "1"
        run: |
          python -m pip install --upgrade build
          python -m pip wheel . --no-deps --wheel-dir sanitized-dist
          python -m pip install --force-reinstall sanitized-dist/*.whl

      - name: Run tests with ASan and UBSan
        env:
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          # Research-only tests import selectors kept outside the wheel in
          # benchmarks/. The installed bielsort package still comes from the
          # sanitized wheel because this path does not expose src/.
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          cd "${RUNNER_TEMP}"
          python -m unittest discover -s "${GITHUB_WORKSPACE}/tests" -v
