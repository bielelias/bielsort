name: Build wheels

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Build only, publish to TestPyPI, or publish a stable tag to PyPI
        required: true
        type: choice
        default: build-only
        options:
          - build-only
          - testpypi
          - pypi
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bielsort-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: Wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.1.1

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  source-distribution:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_target == 'testpypi'
      && github.ref == 'refs/heads/main'
    needs:
      - wheels
      - source-distribution
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/bielsort
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist

      - name: Validate distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  validate-production-release:
    name: Validate stable release
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_target == 'pypi'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate version and tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          pyproject = pathlib.Path("pyproject.toml")
          raw_version = tomllib.loads(pyproject.read_text(encoding="utf-8"))[
              "project"
          ]["version"]

          stable_version = re.fullmatch(
              r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)",
              raw_version,
          )
          if stable_version is None:
              raise SystemExit(
                  f"Refusing production publication of non-stable version "
                  f"{raw_version}"
              )

          source = pathlib.Path("src/bielsort_native/bielsort.py").read_text(
              encoding="utf-8"
          )
          match = re.search(
              r'^__version__\s*=\s*"([^"]+)"',
              source,
              flags=re.MULTILINE,
          )
          if match is None or match.group(1) != raw_version:
              raise SystemExit(
                  "pyproject.toml and bielsort.__version__ do not match"
              )

          expected_ref = f"refs/tags/v{raw_version}"
          actual_ref = os.environ["RELEASE_REF"]
          if actual_ref != expected_ref:
              raise SystemExit(
                  f"Production requires {expected_ref}, received {actual_ref}"
              )

          print(f"Validated stable production release {raw_version}")
          PY

  publish-pypi:
    name: Publish to PyPI
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_target == 'pypi'
    needs:
      - wheels
      - source-distribution
      - validate-production-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bielsort
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist

      - name: Validate distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
