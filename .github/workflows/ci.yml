name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api-types:
    name: Public API stubs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package and type-check tools
        run: |
          python -m pip install .
          python -m pip install -r requirements-typecheck.txt
          python -m pip check

      - name: Compare public stubs with runtime
        run: python -m mypy.stubtest bielsort bielsort_native

      - name: Check public type inference
        run: >-
          python -m mypy --strict --python-version 3.9
          tests/typing/api_contract.py

  python-versions:
    name: CPython ${{ matrix.python-version }} / Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install editable package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Import from outside the repository
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import bielsort, bielsort_native; print(bielsort.__version__)"

  platforms:
    name: ${{ matrix.os }} / CPython ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install editable package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v
